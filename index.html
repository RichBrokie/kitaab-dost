  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes toastSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .toast-animate {
      animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .toast-animate {
        animation: none;
      }
    }
  </style>
</head>

      'All Subjects',
      'Science',

      'Grades 9-10 (Matric)',
      'Grades 11-12 (Intermediate)'

    const URGENCIES = ['All Urgencies', 'Critical', 'High', 'Medium'];

    function getUrgencyBadge(urgency) {
      switch (urgency) {
        case 'Critical':
          return {
            bg: 'bg-rose-50 text-rose-800 border-rose-200',
            dot: 'bg-rose-500'
          };
        case 'High':
          return {
            bg: 'bg-amber-50 text-amber-800 border-amber-200',
            dot: 'bg-amber-500'
          };
        default:
          return {
            bg: 'bg-sky-50 text-sky-800 border-sky-200',
            dot: 'bg-sky-500'
          };
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Delivered':
          return {
            bg: 'bg-teal-50 text-teal-800 border-teal-200',
            icon: 'PackageCheck'
          };
        case 'Fulfilled':
          return {
            bg: 'bg-emerald-50 text-emerald-800 border-emerald-200',
            icon: 'CheckCircle2'
          };
        case 'Shipped':
          return {
            bg: 'bg-indigo-50 text-indigo-800 border-indigo-200',
            icon: 'Truck'
          };
        case 'Partially Funded':
          return {
            bg: 'bg-amber-50 text-amber-800 border-amber-200',
            icon: 'Clock'
          };
        default:
          return {
            bg: 'bg-stone-100 text-stone-700 border-stone-200',
            icon: 'AlertCircle'

    function App() {
      // Active Role View: 'school' | 'ngo' | 'impact'
      const [activePortal, setActivePortal] = useState('school');

      // Requests with LocalStorage persistence
      const [requests, setRequests] = useState(() => {
        try {
          const saved = localStorage.getItem('bookbridge_requests');
          return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
        } catch (e) {
          return INITIAL_REQUESTS;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('bookbridge_requests', JSON.stringify(requests));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      }, [requests]);

      // Toast Notification state with timeout ref to prevent race conditions
      const [toast, setToast] = useState(null);
      const toastTimeoutRef = useRef(null);

      const triggerToast = (title, message) => {
        if (toastTimeoutRef.current) {
          clearTimeout(toastTimeoutRef.current);
        }
        setToast({ title, message });
        toastTimeoutRef.current = setTimeout(() => {
          setToast(null);
        }, 4500);
      };

      // Reset to initial demo data
      const handleResetData = () => {
        if (window.confirm("Reset all requests back to initial sample demo data?")) {
          setRequests(INITIAL_REQUESTS);
          triggerToast("Demo Reset", "Restored sample book requests successfully.");
        }
      };

      // NGO Dashboard Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('All Subjects');
      const [selectedGrade, setSelectedGrade] = useState('All Grades');
      const [selectedUrgency, setSelectedUrgency] = useState('All Urgencies');
      const [statusFilter, setStatusFilter] = useState('Needs Books'); // 'All' | 'Needs Books' | 'Completed'

      // School Portal Filter & Form state
      const [schoolFilterName, setSchoolFilterName] = useState('All Schools');
      const [showNewRequestForm, setShowNewRequestForm] = useState(false);
      const [newRequest, setNewRequest] = useState({
        schoolName: 'Al-Noor Community Model School',
        location: 'Lahore, Punjab',
        gradeLevel: 'Grades 6-8 (Middle)',
        subject: 'Science',
        bookTitle: '',
        description: '',
        quantityNeeded: 40,
        urgency: 'High',
        contactPerson: 'Mrs. Tahira Perveen (Principal)',
        contactPhone: '+92 300 4128901'
      });

      // NGO Donate Modal state
      const [activeDonateReq, setActiveDonateReq] = useState(null);
      const [pledgeData, setPledgeData] = useState({
        ngoName: 'Read Pakistan Foundation',
        quantity: 10,
        note: '',
        markShippedImmediately: false
      });

      // School Confirmation Modal
      const [confirmDeliveryReq, setConfirmDeliveryReq] = useState(null);
      const [receiptNote, setReceiptNote] = useState('');

      const stats = useMemo(() => {
        const totalRequested = requests.reduce((acc, r) => acc + r.quantityNeeded, 0);
        const totalPledged = requests.reduce((acc, r) => acc + r.quantityPledged, 0);
        const fulfilledCount = requests.filter(
          (r) => r.status === 'Fulfilled' || r.status === 'Shipped' || r.status === 'Delivered'
        ).length;
        const uniqueSchools = new Set(requests.map((r) => r.schoolName)).size;
        const totalPledgesCount = requests.reduce((acc, r) => acc + r.pledges.length, 0);

        return {
          totalRequested,
          totalPledged,
          remainingNeeded: Math.max(0, totalRequested - totalPledged),
          fulfilledCount,
          uniqueSchools,
          totalPledgesCount,
          fulfillmentRate: totalRequested > 0 ? Math.round((totalPledged / totalRequested) * 100) : 0
        };
      }, [requests]);

      const filteredNgoRequests = useMemo(() => {
        return requests.filter((req) => {
          const matchesSearch =
            req.schoolName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.location.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.bookTitle.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.subject.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesSubject =
            selectedSubject === 'All Subjects' || req.subject === selectedSubject;
          const matchesGrade =
            selectedGrade === 'All Grades' || req.gradeLevel === selectedGrade;
          const matchesUrgency =
            selectedUrgency === 'All Urgencies' || req.urgency === selectedUrgency;

          const isCompleted = req.quantityPledged >= req.quantityNeeded;
          const matchesStatus =
            statusFilter === 'All' ||
            (statusFilter === 'Needs Books' && !isCompleted) ||
            (statusFilter === 'Completed' && isCompleted);

          return (
            matchesSearch &&
            matchesSubject &&
            matchesGrade &&
            matchesUrgency &&
            matchesStatus
          );
        });
      }, [
        requests,
        searchQuery,
        selectedSubject,
        selectedGrade,
        selectedUrgency,
        statusFilter
      ]);

      const schoolNamesList = useMemo(() => {
        const names = Array.from(new Set(requests.map((r) => r.schoolName)));
        return ['All Schools', ...names];
      }, [requests]);

      const filteredSchoolRequests = useMemo(() => {
        if (schoolFilterName === 'All Schools') return requests;
        return requests.filter((r) => r.schoolName === schoolFilterName);
      }, [requests, schoolFilterName]);

      const handleCreateRequest = (e) => {
        e.preventDefault();
        if (!newRequest.bookTitle.trim() || !newRequest.schoolName.trim()) return;

        const created = {
          id: `req-${Date.now()}`,
          ...newRequest,
          quantityNeeded: Number(newRequest.quantityNeeded) || 25,
          quantityPledged: 0,
          status: 'Pending',
          createdAt: 'Just now',
          pledges: []
        };

        setRequests((prev) => [created, ...prev]);
        setShowNewRequestForm(false);
        setNewRequest((prev) => ({
          ...prev,
          bookTitle: '',
          description: '',
          quantityNeeded: 40
        }));

        triggerToast(
          'Book Request Published!',
          `"${created.bookTitle}" (${created.quantityNeeded} copies) is now live on the NGO Donor Dashboard.`
        );
      };

      const openDonateModal = (req) => {
        const remaining = Math.max(1, req.quantityNeeded - req.quantityPledged);
        setActiveDonateReq(req);
        setPledgeData({
          ngoName: 'Read Pakistan Foundation',
          quantity: remaining,
          note: 'We have these books in stock and will dispatch them within 48 hours.',
          markShippedImmediately: false
        });
      };

      const handleConfirmPledge = (e) => {
        e.preventDefault();
        if (!activeDonateReq) return;

        // Look up the live request from current state to avoid stale closure
        const liveReq = requests.find(r => r.id === activeDonateReq.id);
        if (!liveReq) return;

        const remaining = liveReq.quantityNeeded - liveReq.quantityPledged;
        if (remaining <= 0) {
          triggerToast('Already Fulfilled', 'This request has already been fully pledged.');
          setActiveDonateReq(null);
          return;
        }

        const validQty = Math.min(Math.max(1, Number(pledgeData.quantity) || 1), remaining);

        const newPledgeObj = {
          id: `p-${Date.now()}`,
          ngoName: pledgeData.ngoName.trim() || 'Partner Education NGO',
          quantity: validQty,
          note:
            pledgeData.note.trim() ||
            'Books pledged and scheduled for school delivery.',
          date: 'Just now'
        };

        setRequests((prev) =>
          prev.map((req) => {
            if (req.id !== activeDonateReq.id) return req;
            const updatedPledged = req.quantityPledged + validQty;
            const isFullyFunded = updatedPledged >= req.quantityNeeded;
            let nextStatus = 'Partially Funded';
            if (isFullyFunded) {
              nextStatus = pledgeData.markShippedImmediately ? 'Shipped' : 'Fulfilled';
            }

            return {
              ...req,
              quantityPledged: updatedPledged,
              status: nextStatus,
              pledges: [newPledgeObj, ...req.pledges]
            };
          })
        );

        triggerToast(
          'Donation Pledge Confirmed!',
          `You pledged ${validQty} copies to ${activeDonateReq.schoolName}. Both portals have been updated in real time!`
        );
        setActiveDonateReq(null);
      };

      const handleMarkAsShipped = (reqId) => {
        setRequests((prev) =>
          prev.map((r) => (r.id === reqId ? { ...r, status: 'Shipped' } : r))
        );
        triggerToast(
          'Delivery Status Updated',
          'Marked request as Shipped! The school can now track incoming delivery.'
        );
      };

      const handleConfirmReceipt = (e) => {
        e.preventDefault();
        if (!confirmDeliveryReq) return;

        setRequests((prev) =>
          prev.map((r) => {
            if (r.id !== confirmDeliveryReq.id) return r;
            const schoolAck = {
              id: `p-ack-${Date.now()}`,
              ngoName: '🏫 School Receipt Confirmed',
              quantity: r.quantityPledged,
              note: receiptNote.trim() || 'All books received safely and placed in classroom circulation. Heartfelt thanks to donors!',
              date: 'Just now'
            };
            return {
              ...r,
              status: 'Delivered',
              pledges: [schoolAck, ...r.pledges]
            };

                      className="px-4 py-2.5 rounded-xl border border-stone-300 text-stone-600 font-medium text-sm hover:bg-stone-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-md cursor-pointer"
                    >
                      <Icon name="Check" className="w-4 h-4" />
                      <span>Confirm Book Pledge</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              MODAL: SCHOOL CONFIRM DELIVERY RECEIPT
             ========================================== */}
          {confirmDeliveryReq && (
            <div className="fixed inset-0 z-50 bg-stone-950/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 border border-stone-200 shadow-2xl space-y-6">
                <div className="flex items-start justify-between gap-4 border-b border-stone-100 pb-4">
                  <div>
                    <span className="text-xs font-semibold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full">
                      School Delivery Receipt
                    </span>
                    <h3 className="text-xl font-bold text-stone-900 mt-2">
                      Confirm Arrival of Books
                    </h3>
                    <p className="text-xs text-stone-500 mt-0.5">
                      {confirmDeliveryReq.bookTitle} — {confirmDeliveryReq.schoolName}
                    </p>
                  </div>
                  <button
                    onClick={() => setConfirmDeliveryReq(null)}
                    className="p-1.5 text-stone-400 hover:text-stone-700 rounded-lg cursor-pointer"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleConfirmReceipt} className="space-y-4">
                  <div className="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200 text-xs text-indigo-950 space-y-1">
                    <div className="font-bold flex items-center gap-1.5">
                      <Icon name="PackageCheck" className="w-4 h-4 text-indigo-600" />
                      <span>{confirmDeliveryReq.quantityPledged} Books Shipped to School</span>
                    </div>
                    <p className="text-indigo-800">
                      Confirming arrival marks this request as <strong>Delivered</strong> and sends an acknowledgment to the donor NGO.
                    </p>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">
                      Receipt & Thank You Note (Optional)
                    </label>
                    <textarea
                      rows={3}
                      value={receiptNote}
                      onChange={(e) => setReceiptNote(e.target.value)}
                      placeholder="e.g., Books arrived safely today in good condition. Distributed to Grade 8 students. Thank you!"
                      className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:border-indigo-600 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-stone-100">
                    <button
                      type="button"
                      onClick={() => setConfirmDeliveryReq(null)}
                      className="px-4 py-2.5 rounded-xl border border-stone-300 text-stone-600 font-medium text-sm hover:bg-stone-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md cursor-pointer"
                    >
                      <Icon name="Check" className="w-4 h-4" />
                      <span>Confirm Books Received in Classroom</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-stone-200 py-6 px-4 text-center text-xs text-stone-500 mt-12">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2 font-semibold text-stone-700">
                <Icon name="BookOpen" className="w-4 h-4 text-emerald-600" />
                <span>BookBridge — Connecting Classrooms & Education NGOs</span>
              </div>
              <div>
                Interactive Dual-Portal Demo with Local Browser Persistence
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
