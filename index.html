  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes toastSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .toast-animate {
      animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .toast-animate {
        animation: none;
      }
    }
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-dispatch-slip, #printable-dispatch-slip * {
        visibility: visible !important;
      }
      #printable-dispatch-slip {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 24px !important;
        background: white !important;
        color: black !important;
        border: none !important;
        box-shadow: none !important;
        z-index: 99999 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

    const Icon = ({ name, className = "w-4 h-4", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        aria-hidden="true"
        {...props}
      >
        {ICON_PATHS[name] || null}
      </svg>
    );

    const INITIAL_REQUESTS = [];

    const SUBJECTS = [
      'All Subjects',
      'Science',
      'Mathematics',
      'English Literature',
      'Urdu & Regional',
      'Computer Science',
      'Social Studies'
    ];

    const GRADES = [
      'All Grades',
      'Grades 1-5 (Primary)',
      'Grades 6-8 (Middle)',
      'Grades 9-10 (Matric)',
      'Grades 11-12 (Intermediate)'
    ];

    const URGENCIES = ['All Urgencies', 'Critical', 'High', 'Medium'];

    function getUrgencyBadge(urgency) {
      switch (urgency) {
        case 'Critical':
          return {
            bg: 'bg-rose-50 text-rose-800 border-rose-200',
            dot: 'bg-rose-500'
          };
        case 'High':
          return {
            bg: 'bg-amber-50 text-amber-800 border-amber-200',
            dot: 'bg-amber-500'
          };
        default:
          return {
            bg: 'bg-sky-50 text-sky-800 border-sky-200',
            dot: 'bg-sky-500'
          };
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Delivered':
          return {
            bg: 'bg-teal-50 text-teal-800 border-teal-200',
            icon: 'PackageCheck'
          };
        case 'Fulfilled':
          return {
            bg: 'bg-emerald-50 text-emerald-800 border-emerald-200',
            icon: 'CheckCircle2'
          };
        case 'Shipped':
          return {
            bg: 'bg-indigo-50 text-indigo-800 border-indigo-200',
            icon: 'Truck'
          };
        case 'Partially Funded':
          return {
            bg: 'bg-amber-50 text-amber-800 border-amber-200',
            icon: 'Clock'
          };
        default:
          return {
            bg: 'bg-stone-100 text-stone-700 border-stone-200',
            icon: 'AlertCircle'
          };
      }
    }

    // --- Supabase Cloud Database Configuration ---
    const SUPABASE_URL = 'https://uqotflogqjlkhozhrpdd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_CnrssUURtC-vv4cYyRTRpw_1Bc-HHI3';
    const supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function App() {
      // Active Portal View: 'gateway' | 'school' | 'ngo' | 'impact'
      const [activePortal, setActivePortal] = useState(() => {
        try {
          const savedUser = localStorage.getItem('bookbridge_user');
          if (savedUser) {
            const u = JSON.parse(savedUser);
            if (u?.role === 'school') return 'school';
            if (u?.role === 'ngo') return 'ngo';
          }
        } catch (e) {}
        return 'gateway';
      });
      const [dbConnected, setDbConnected] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);

      // Requests with fallback to LocalStorage
      const [requests, setRequests] = useState(() => {
        try {
          const saved = localStorage.getItem('bookbridge_requests');
          return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
        } catch (e) {
          return INITIAL_REQUESTS;
        }
      });

      // Fetch all requests and pledges from Supabase
      const fetchRequestsFromSupabase = async () => {
        if (!supabaseClient) return;
        setIsSyncing(true);
        try {
          const { data, error } = await supabaseClient
            .from('book_requests')
            .select('*, pledges(*)')
            .order('created_at', { ascending: false });

          if (error) throw error;
          if (data && data.length > 0) {
            const formatted = data.map((r) => ({
              id: r.id,
              schoolName: r.school_name,
              emisCode: r.emis_code || '',
              location: r.location,
              deliveryAddress: r.delivery_address || '',
              gradeLevel: r.grade_level,
              subject: r.subject,
              bookTitle: r.book_title,
              description: r.description,
              quantityNeeded: r.quantity_needed,
              quantityPledged: r.quantity_pledged,
              urgency: r.urgency,
              contactPerson: r.contact_person,
              contactPhone: r.contact_phone,
              status: r.status,
              createdAt: r.created_at ? new Date(r.created_at).toLocaleDateString() : 'Recently',
              pledges: (r.pledges || []).map((p) => ({
                id: p.id,
                ngoName: p.ngo_name,
                quantity: p.quantity,
                note: p.note,
                date: p.created_at ? new Date(p.created_at).toLocaleDateString() : 'Recently'
              }))
            }));
            setRequests(formatted);
            setDbConnected(true);
          }
        } catch (err) {
          console.warn('Supabase fetch notice (using local cache):', err);
        } finally {
          setIsSyncing(false);
        }
      };

      // Realtime multi-user syncing: auto updates when any user/school/NGO adds data
      useEffect(() => {
        fetchRequestsFromSupabase();

        let channel = null;
        if (supabaseClient) {
          channel = supabaseClient
            .channel('public:realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'book_requests' }, () => {
              fetchRequestsFromSupabase();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pledges' }, () => {
              fetchRequestsFromSupabase();
            })
            .subscribe((status) => {
              if (status === 'SUBSCRIBED') {
                setDbConnected(true);
              }
            });
        }

        return () => {
          if (channel && supabaseClient) {
            supabaseClient.removeChannel(channel);
          }
        };
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('bookbridge_requests', JSON.stringify(requests));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      }, [requests]);

      // Auth & Profile State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('bookbridge_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin' | 'signup'
      const [authRole, setAuthRole] = useState('school'); // 'school' | 'ngo'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      const [authOrg, setAuthOrg] = useState('');
      const [authLocation, setAuthLocation] = useState('Lahore, Punjab');
      const [authPhone, setAuthPhone] = useState('+92 300 1234567');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem('bookbridge_user', JSON.stringify(currentUser));
          } else {
            localStorage.removeItem('bookbridge_user');
          }
        } catch (e) {}
      }, [currentUser]);

      // Supabase Auth session watcher
      useEffect(() => {
        if (supabaseClient) {
          supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session?.user) {
              const meta = session.user.user_metadata || {};
              setCurrentUser({
                id: session.user.id,
                email: session.user.email,
                role: meta.role || 'school',
                name: meta.name || session.user.email.split('@')[0],
                organization: meta.organization || meta.name || 'Partner School',
                location: meta.location || 'Pakistan',
                phone: meta.phone || ''
              });
            }
          });

          const { data: authListener } = supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session?.user) {
              const meta = session.user.user_metadata || {};
              setCurrentUser({
                id: session.user.id,
                email: session.user.email,
                role: meta.role || 'school',
                name: meta.name || session.user.email.split('@')[0],
                organization: meta.organization || meta.name || 'Partner School',
                location: meta.location || 'Pakistan',
                phone: meta.phone || ''
              });
            } else if (event === 'SIGNED_OUT') {
              setCurrentUser(null);
            }
          });

          return () => {
            authListener?.subscription?.unsubscribe();
          };
        }
      }, []);


      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);

        try {
          if (!supabaseClient) {
            const offlineUser = {
              id: `usr-${Date.now()}`,
              email: authEmail,
              role: authRole,
              name: authName || (authRole === 'school' ? 'School Administrator' : 'NGO Representative'),
              organization: authOrg || (authRole === 'school' ? 'Local Model School' : 'Education Trust'),
              location: authLocation,
              phone: authPhone
            };
            setCurrentUser(offlineUser);
            setActivePortal(authRole);
            setShowAuthModal(false);
            triggerToast('Signed In!', `Welcome, ${offlineUser.organization}!`);
            return;
          }

          if (authMode === 'signup') {
            const { data, error } = await supabaseClient.auth.signUp({
              email: authEmail,
              password: authPassword,
              options: {
                data: {
                  role: authRole,
                  name: authName,
                  organization: authOrg,
                  location: authLocation,
                  phone: authPhone
                }
              }
            });
            if (error) throw error;
            if (data?.user) {
              const u = {
                id: data.user.id,
                email: data.user.email,
                role: authRole,
                name: authName || data.user.email.split('@')[0],
                organization: authOrg || authName || 'Partner',
                location: authLocation,
                phone: authPhone
              };
              setCurrentUser(u);
              setActivePortal(authRole);
              setShowAuthModal(false);
              triggerToast('Account Registered!', `Welcome to Kitaab Dost, ${u.organization}!`);
            }
          } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: authEmail,
              password: authPassword
            });
            if (error) throw error;
            if (data?.user) {
              const meta = data.user.user_metadata || {};
              const u = {
                id: data.user.id,
                email: data.user.email,
                role: meta.role || authRole,
                name: meta.name || data.user.email.split('@')[0],
                organization: meta.organization || meta.name || 'Organization',
                location: meta.location || 'Pakistan',
                phone: meta.phone || ''
              };
              setCurrentUser(u);
              setActivePortal(u.role);
              setShowAuthModal(false);
              triggerToast('Welcome Back!', `Signed in as ${u.organization}.`);
            }
          }
        } catch (err) {
          setAuthError(err.message || 'Authentication error. Please check credentials.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        if (supabaseClient) {
          try {
            await supabaseClient.auth.signOut();
          } catch (e) {}
        }
        setCurrentUser(null);
        setActivePortal('gateway');
        triggerToast('Signed Out', 'You have been safely signed out.');
      };

      const handleOpenSchoolPortal = () => {
        if (currentUser) {
          if (currentUser.role === 'school') {
            setActivePortal('school');
          } else {
            triggerToast('Access Restricted', 'You are currently signed in as an NGO. Sign out first to access the School Portal.');
          }
        } else {
          setAuthRole('school');
          setAuthMode('signin');
          setShowAuthModal(true);
        }
      };

      const handleOpenNgoPortal = () => {
        if (currentUser) {
          if (currentUser.role === 'ngo') {
            setActivePortal('ngo');
          } else {
            triggerToast('Access Restricted', 'You are currently signed in as a School. Sign out first to access the NGO Donor Portal.');
          }
        } else {
          setAuthRole('ngo');
          setAuthMode('signin');
          setShowAuthModal(true);
        }
      };

      // Strict Role-Based Access Control (RBAC) Guard
      useEffect(() => {
        if (currentUser) {
          if (currentUser.role === 'school' && activePortal === 'ngo') {
            setActivePortal('school');
            triggerToast('Access Restricted', 'Your account is registered as a School. NGO Donor Portal is restricted.');
          } else if (currentUser.role === 'ngo' && activePortal === 'school') {
            setActivePortal('ngo');
            triggerToast('Access Restricted', 'Your account is registered as an NGO. School Request Portal is restricted.');
          } else if (activePortal === 'gateway') {
            setActivePortal(currentUser.role);
          }
          if (currentUser.role === 'school') {
            setSchoolFilterScope('my');
          }
        }
      }, [currentUser, activePortal]);

      // Toast Notification state with timeout ref to prevent race conditions
      const [toast, setToast] = useState(null);
      const toastTimeoutRef = useRef(null);

      const triggerToast = (title, message) => {
        if (toastTimeoutRef.current) {
          clearTimeout(toastTimeoutRef.current);
        }
        setToast({ title, message });
        toastTimeoutRef.current = setTimeout(() => {
          setToast(null);
        }, 4500);
      };

      // NGO Dashboard Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('All Subjects');
      const [selectedGrade, setSelectedGrade] = useState('All Grades');
      const [selectedUrgency, setSelectedUrgency] = useState('All Urgencies');
      const [statusFilter, setStatusFilter] = useState('Needs Books'); // 'All' | 'Needs Books' | 'Completed'

      // School Portal Filter & Form state
      const [schoolFilterName, setSchoolFilterName] = useState('All Schools');
      const [schoolFilterScope, setSchoolFilterScope] = useState('my'); // 'my' | 'all'
      const [showNewRequestForm, setShowNewRequestForm] = useState(false);
      const [newRequest, setNewRequest] = useState({
        schoolName: '',
        emisCode: '',
        location: '',
        deliveryAddress: '',
        gradeLevel: 'Grades 6-8 (Middle)',
        subject: 'Science',
        bookTitle: '',
        description: '',
        quantityNeeded: 30,
        urgency: 'High',
        contactPerson: '',
        contactPhone: ''
      });

      // NGO Donate Modal state
      const [activeDonateReq, setActiveDonateReq] = useState(null);
      const [pledgeData, setPledgeData] = useState({
        ngoName: '',
        quantity: 10,
        note: '',
        markShippedImmediately: false
      });

      // School Confirmation Modal
      const [confirmDeliveryReq, setConfirmDeliveryReq] = useState(null);
      const [receiptNote, setReceiptNote] = useState('');

      // Printable Courier Packing & Dispatch Slip Modal
      const [activeDispatchSlipReq, setActiveDispatchSlipReq] = useState(null);

      const stats = useMemo(() => {
        const totalRequested = requests.reduce((acc, r) => acc + r.quantityNeeded, 0);
        const totalPledged = requests.reduce((acc, r) => acc + r.quantityPledged, 0);
        const fulfilledCount = requests.filter(
          (r) => r.status === 'Fulfilled' || r.status === 'Shipped' || r.status === 'Delivered'
        ).length;
        const uniqueSchools = new Set(requests.map((r) => r.schoolName)).size;
        const totalPledgesCount = requests.reduce((acc, r) => acc + r.pledges.length, 0);

        return {
          totalRequested,
          totalPledged,
          remainingNeeded: Math.max(0, totalRequested - totalPledged),
          fulfilledCount,
          uniqueSchools,
          totalPledgesCount,
          fulfillmentRate: totalRequested > 0 ? Math.round((totalPledged / totalRequested) * 100) : 0
        };
      }, [requests]);

      const filteredNgoRequests = useMemo(() => {
        return requests.filter((req) => {
          const matchesSearch =
            req.schoolName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.location.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.bookTitle.toLowerCase().includes(searchQuery.toLowerCase()) ||
            req.subject.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesSubject =
            selectedSubject === 'All Subjects' || req.subject === selectedSubject;
          const matchesGrade =
            selectedGrade === 'All Grades' || req.gradeLevel === selectedGrade;
          const matchesUrgency =
            selectedUrgency === 'All Urgencies' || req.urgency === selectedUrgency;

          const isCompleted = req.quantityPledged >= req.quantityNeeded;
          const matchesStatus =
            statusFilter === 'All' ||
            (statusFilter === 'Needs Books' && !isCompleted) ||
            (statusFilter === 'Completed' && isCompleted);

          return (
            matchesSearch &&
            matchesSubject &&
            matchesGrade &&
            matchesUrgency &&
            matchesStatus
          );
        });
      }, [
        requests,
        searchQuery,
        selectedSubject,
        selectedGrade,
        selectedUrgency,
        statusFilter
      ]);

      const schoolNamesList = useMemo(() => {
        const names = Array.from(new Set(requests.map((r) => r.schoolName)));
        return ['All Schools', ...names];
      }, [requests]);

      const isSchoolUser = currentUser?.role === 'school';
      const userSchoolOrg = (currentUser?.organization || '').trim();

      const mySchoolRequests = useMemo(() => {
        if (!isSchoolUser || !userSchoolOrg) return [];
        return requests.filter(
          (r) => (r.schoolName || '').trim().toLowerCase() === userSchoolOrg.toLowerCase()
        );
      }, [requests, isSchoolUser, userSchoolOrg]);

      const filteredSchoolRequests = useMemo(() => {
        if (isSchoolUser && schoolFilterScope === 'my') {
          return mySchoolRequests;
        }
        if (schoolFilterName === 'All Schools') return requests;
        return requests.filter((r) => r.schoolName === schoolFilterName);
      }, [requests, isSchoolUser, schoolFilterScope, mySchoolRequests, schoolFilterName]);

      const handleCreateRequest = async (e) => {
        e.preventDefault();
        const effectiveSchoolName = (currentUser?.role === 'school' && currentUser?.organization)
          ? currentUser.organization.trim()
          : newRequest.schoolName.trim();

        if (!newRequest.bookTitle.trim() || !effectiveSchoolName) return;

        const created = {
          id: `req-${Date.now()}`,
          ...newRequest,
          schoolName: effectiveSchoolName,
          quantityNeeded: Number(newRequest.quantityNeeded) || 25,
          quantityPledged: 0,
          status: 'Pending',
          createdAt: 'Just now',
          pledges: []
        };

        setRequests((prev) => [created, ...prev]);
        setShowNewRequestForm(false);
        setNewRequest((prev) => ({
          ...prev,
          bookTitle: '',
          description: '',
          quantityNeeded: 40
        }));

        triggerToast(
          'Book Request Published!',
          `"${created.bookTitle}" (${created.quantityNeeded} copies) saved to cloud database.`
        );

        if (supabaseClient) {
          try {
            await supabaseClient.from('book_requests').insert({
              id: created.id,
              school_name: created.schoolName,
              emis_code: created.emisCode || null,
              location: created.location,
              delivery_address: created.deliveryAddress || null,
              grade_level: created.gradeLevel,
              subject: created.subject,
              book_title: created.bookTitle,
              description: created.description,
              quantity_needed: created.quantityNeeded,
              quantity_pledged: 0,
              urgency: created.urgency,
              contact_person: created.contactPerson,
              contact_phone: created.contactPhone,
              status: 'Pending'
            });
            fetchRequestsFromSupabase();
          } catch (err) {
            console.error('Supabase insert error:', err);
          }
        }
      };

      const handleToggleNewRequestForm = () => {
        if (!showNewRequestForm && !currentUser) {
          setAuthRole('school');
          setAuthMode('signin');
          setShowAuthModal(true);
          triggerToast('Sign-In Required', 'Please sign in or register your school to submit book requests.');
          return;
        }
        if (!showNewRequestForm && currentUser?.role === 'school') {
          setNewRequest((prev) => ({
            ...prev,
            schoolName: currentUser.organization || prev.schoolName,
            location: currentUser.location || prev.location,
            contactPerson: currentUser.name || prev.contactPerson,
            contactPhone: currentUser.phone || prev.contactPhone
          }));
        }
        setShowNewRequestForm(!showNewRequestForm);
      };

      const openDonateModal = (req) => {
        if (!currentUser) {
          setAuthRole('ngo');
          setAuthMode('signin');
          setShowAuthModal(true);
          triggerToast('Sign-In Required', 'Please sign in or register as an NGO / donor to pledge books.');
          return;
        }
        const remaining = Math.max(1, req.quantityNeeded - req.quantityPledged);
        setActiveDonateReq(req);
        setPledgeData({
          ngoName: currentUser.role === 'ngo' ? currentUser.organization : '',
          quantity: remaining,
          note: 'We have these books in stock and will dispatch them promptly.',
          markShippedImmediately: false
        });
      };

      const handleConfirmPledge = async (e) => {
        e.preventDefault();
        if (!activeDonateReq) return;

        const liveReq = requests.find(r => r.id === activeDonateReq.id);
        if (!liveReq) return;

        const remaining = liveReq.quantityNeeded - liveReq.quantityPledged;
        if (remaining <= 0) {
          triggerToast('Already Fulfilled', 'This request has already been fully pledged.');
          setActiveDonateReq(null);
          return;
        }

        const validQty = Math.min(Math.max(1, Number(pledgeData.quantity) || 1), remaining);

        const effectiveNgoName = (currentUser?.role === 'ngo' && currentUser?.organization)
          ? currentUser.organization.trim()
          : (pledgeData.ngoName.trim() || 'Partner Education NGO');

        const newPledgeObj = {
          id: `p-${Date.now()}`,
          ngoName: effectiveNgoName,
          quantity: validQty,
          note:
            pledgeData.note.trim() ||
            'Books pledged and scheduled for school delivery.',
          date: 'Just now'
        };

        const updatedPledged = liveReq.quantityPledged + validQty;
        const isFullyFunded = updatedPledged >= liveReq.quantityNeeded;
        let nextStatus = 'Partially Funded';
        if (isFullyFunded) {
          nextStatus = pledgeData.markShippedImmediately ? 'Shipped' : 'Fulfilled';
        }

        setRequests((prev) =>
          prev.map((req) => {
            if (req.id !== liveReq.id) return req;
            return {
              ...req,
              quantityPledged: updatedPledged,
              status: nextStatus,
              pledges: [newPledgeObj, ...req.pledges]
            };
          })
        );

        triggerToast(
          'Donation Pledge Confirmed!',
          `You pledged ${validQty} copies to ${liveReq.schoolName}. Cloud database updated!`
        );
        setActiveDonateReq(null);

        if (supabaseClient) {
          try {
            await supabaseClient.from('pledges').insert({
              id: newPledgeObj.id,
              request_id: liveReq.id,
              ngo_name: newPledgeObj.ngoName,
              quantity: newPledgeObj.quantity,
              note: newPledgeObj.note
            });
            await supabaseClient.from('book_requests').update({
              quantity_pledged: updatedPledged,
              status: nextStatus
            }).eq('id', liveReq.id);
            fetchRequestsFromSupabase();
          } catch (err) {
            console.error('Supabase pledge error:', err);
          }
        }
      };

      const handleMarkAsShipped = async (reqId) => {
        const targetReq = requests.find((r) => r.id === reqId);
        if (!targetReq) return;

        const userNgo = (currentUser?.organization || '').trim().toLowerCase();
        const hasPledged = (targetReq.pledges || []).some(
          (p) => (p.ngoName || '').trim().toLowerCase() === userNgo
        );

        if (!hasPledged && currentUser?.role !== 'admin') {
          triggerToast(
            'Unauthorized Action',
            'Only the donor NGO that pledged books to this request can mark it as dispatched.'
          );
          return;
        }

        setRequests((prev) =>
          prev.map((r) => (r.id === reqId ? { ...r, status: 'Shipped' } : r))
        );
        triggerToast(
          'Delivery Status Updated',
          'Marked request as Shipped in cloud! The school can now track incoming delivery.'
        );

        if (supabaseClient) {
          try {
            await supabaseClient.from('book_requests').update({
              status: 'Shipped'
            }).eq('id', reqId);
            fetchRequestsFromSupabase();
          } catch (err) {
            console.error('Supabase status update error:', err);
          }
        }
      };

      const handleConfirmReceipt = async (e) => {
        e.preventDefault();
        if (!confirmDeliveryReq) return;

        const userSchool = (currentUser?.organization || '').trim().toLowerCase();
        const targetSchool = (confirmDeliveryReq.schoolName || '').trim().toLowerCase();

        if (currentUser?.role !== 'school' || userSchool !== targetSchool) {
          triggerToast(
            'Unauthorized Action',
            `Only the administration of "${confirmDeliveryReq.schoolName}" can confirm delivery of this package.`
          );
          setConfirmDeliveryReq(null);
          return;
        }

        const schoolAck = {
          id: `p-ack-${Date.now()}`,
          ngoName: `🏫 ${confirmDeliveryReq.schoolName} (Receipt Confirmed)`,
          quantity: confirmDeliveryReq.quantityPledged,
          note: receiptNote.trim() || 'All books received safely and placed in classroom circulation. Heartfelt thanks to donors!',
          date: 'Just now'
        };

        const targetId = confirmDeliveryReq.id;

        setRequests((prev) =>
          prev.map((r) => {
            if (r.id !== targetId) return r;
            return {
              ...r,
              status: 'Delivered',
              pledges: [schoolAck, ...r.pledges]
            };
          })
        );

        triggerToast(
          'Delivery Confirmed!',
          `Books for ${confirmDeliveryReq.schoolName} marked as Delivered in classroom!`
        );
        setConfirmDeliveryReq(null);
        setReceiptNote('');

        if (supabaseClient) {
          try {
            await supabaseClient.from('pledges').insert({
              id: schoolAck.id,
              request_id: targetId,
              ngo_name: schoolAck.ngoName,
              quantity: schoolAck.quantity,
              note: schoolAck.note
            });
            await supabaseClient.from('book_requests').update({
              status: 'Delivered'
            }).eq('id', targetId);
            fetchRequestsFromSupabase();
          } catch (err) {
            console.error('Supabase receipt error:', err);
          }
        }
      };

      return (
        <div className="min-h-screen bg-[#FAF8F5] text-stone-800 flex flex-col font-sans">
          {/* Real-time Notification Toast */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-md bg-stone-900 text-white px-5 py-4 rounded-2xl shadow-2xl border border-stone-700 flex items-start gap-3.5 toast-animate">
              <div className="p-2 bg-emerald-600 rounded-xl shrink-0 mt-0.5">
                <Icon name="Sparkles" className="w-5 h-5 text-amber-200" />
              </div>
              <div className="flex-1">
                <h4 className="font-semibold text-sm text-stone-100">{toast.title}</h4>
                <p className="text-xs text-stone-300 mt-1 leading-relaxed">
                  {toast.message}
                </p>
              </div>
              <button
                onClick={() => setToast(null)}
                className="text-stone-400 hover:text-white p-1"
              >
                <Icon name="X" className="w-4 h-4" />
              </button>
            </div>
          )}

          {/* Main Brand Header */}
          <header className="bg-white border-b border-stone-200 shadow-sm sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
              <div 
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => setActivePortal(currentUser ? currentUser.role : 'gateway')}
                title="Kitaab Dost Network — Home"
              >
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 flex items-center justify-center text-white shadow-md">
                  <Icon name="BookOpen" className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-bold tracking-tight text-stone-900">
                      Kitaab Dost Network
                    </h1>
                  </div>
                  <p className="text-xs text-stone-500">
                    Connecting under-resourced Pakistani classrooms directly with education NGOs
                  </p>
                </div>
              </div>

              {/* Quick Live Stats Strip */}
              <div className="flex items-center gap-6 bg-stone-50 px-4 py-2 rounded-2xl border border-stone-200">
                <div className="text-center sm:text-left">
                  <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold">
                    Books Pledged
                  </div>
                  <div className="text-base font-bold text-emerald-700">
                    {stats.totalPledged}{' '}
                    <span className="text-xs font-normal text-stone-500">
                      / {stats.totalRequested} needed
                    </span>
                  </div>
                </div>
                <div className="h-7 w-px bg-stone-200" />
                <div className="text-center sm:text-left">
                  <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold">
                    Fulfillment Rate
                  </div>
                  <div className="text-base font-bold text-amber-600">
                    {stats.fulfillmentRate}%
                  </div>
                </div>
                <div className="h-7 w-px bg-stone-200 hidden sm:block" />
                <div className="hidden sm:block">
                  <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold">
                    Partner Schools
                  </div>
                  <div className="text-base font-bold text-stone-800">
                    {stats.uniqueSchools} Registered
                  </div>
                </div>
              </div>

              {/* Right Controls: Impact Button + User Account / Login */}
              <div className="flex items-center gap-2.5">
                <button
                  type="button"
                  onClick={() => setActivePortal(activePortal === 'impact' ? (currentUser ? currentUser.role : 'gateway') : 'impact')}
                  className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border transition-all cursor-pointer ${
                    activePortal === 'impact'
                      ? 'bg-sky-600 text-white border-sky-600 shadow-sm'
                      : 'bg-stone-50 hover:bg-stone-100 text-stone-700 border-stone-200 hover:border-stone-300'
                  }`}
                  title="View National Transparency & Impact Statistics"
                >
                  <Icon name="BarChart3" className={`w-3.5 h-3.5 ${activePortal === 'impact' ? 'text-white' : 'text-sky-600'}`} />
                  <span>Impact</span>
                </button>

                {currentUser ? (
                  <div className="flex items-center gap-3 bg-stone-50 px-3.5 py-2 rounded-2xl border border-stone-200 shadow-sm">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 text-stone-950 font-bold flex items-center justify-center text-sm shadow-sm shrink-0">
                      {currentUser.role === 'school' ? '🏫' : '🤝'}
                    </div>
                    <div className="text-left">
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-bold text-stone-900 leading-tight truncate max-w-[170px]">
                          {currentUser.organization}
                        </span>
                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold ${
                          currentUser.role === 'school' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                        }`}>
                          {currentUser.role === 'school' ? 'School' : 'NGO'}
                        </span>
                      </div>
                      <div className="text-[11px] text-stone-500 truncate max-w-[170px]">
                        {currentUser.name}
                      </div>
                    </div>
                    <button
                      onClick={handleSignOut}
                      title="Sign Out"

                    >
                      <Icon name="LogOut" className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleOpenSchoolPortal}
                      className="inline-flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-stone-950 px-3.5 py-2.5 rounded-2xl text-xs font-bold shadow-sm transition-all cursor-pointer"
                      title="School Administrator & Teacher Portal"
                    >
                      <Icon name="School" className="w-4 h-4" />
                      <span>School Login</span>
                    </button>
                    <button
                      onClick={handleOpenNgoPortal}
                      className="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-2xl text-xs font-bold shadow-sm transition-all cursor-pointer"
                      title="Education NGO & Donor Dashboard"
                    >
                      <Icon name="HeartHandshake" className="w-4 h-4" />
                      <span>NGO Login</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {/* ==========================================
                VIEW 0: PUBLIC GATEWAY / PORTAL SELECTOR
               ========================================== */}
            {activePortal === 'gateway' && (
              <div className="space-y-10">
                {/* Gateway Welcome Hero */}
                <div className="text-center max-w-3xl mx-auto space-y-3 pt-2 pb-2">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-semibold">
                    <Icon name="BookOpen" className="w-3.5 h-3.5" />
                    <span>Kitaab Dost Network — Bridging the Educational Divide</span>
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight">
                    Select Your Access Portal
                  </h2>
                  <p className="text-stone-600 text-sm sm:text-base leading-relaxed">
                    A dedicated platform connecting under-resourced public & community schools directly with verified education NGOs, trusts, and book donors.
                  </p>
                </div>

                {/* Two Distinct Portal Entrance Doors */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl mx-auto">
                  {/* Door 1: School Portal */}
                  <div className="bg-white rounded-3xl p-7 sm:p-8 border-2 border-amber-300 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-6">
                    <div className="space-y-4">
                      <div className="w-14 h-14 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center">
                        <Icon name="School" className="w-7 h-7 text-amber-700" />
                      </div>
                      <div>
                        <span className="text-[11px] font-bold uppercase tracking-wider text-amber-800 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
                          For Headmasters & Teachers
                        </span>
                        <h3 className="text-2xl font-bold text-stone-900 mt-2.5">
                          School Administrator Portal
                        </h3>
                        <p className="text-stone-600 text-sm mt-2 leading-relaxed">
                          Request curriculum textbooks, Urdu storybooks, and classroom reading sets for your students. Track incoming courier shipments directly to your school gate.
                        </p>
                      </div>
                    </div>
                    <div className="pt-4 border-t border-stone-100 flex flex-col sm:flex-row gap-2.5">
                      <button
                        onClick={handleOpenSchoolPortal}
                        className="flex-1 py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold text-sm text-center transition-all cursor-pointer shadow-sm"
                      >
                        Sign In as School
                      </button>
                      <button
                        onClick={() => {
                          setAuthRole('school');
                          setAuthMode('signup');
                          setShowAuthModal(true);
                        }}
                        className="py-3 px-4 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 font-semibold text-sm border border-amber-300 transition-all cursor-pointer text-center"
                      >
                        Register School
                      </button>
                    </div>
                  </div>

                  {/* Door 2: NGO Portal */}
                  <div className="bg-white rounded-3xl p-7 sm:p-8 border-2 border-emerald-300 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-6">
                    <div className="space-y-4">
                      <div className="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center">
                        <Icon name="HeartHandshake" className="w-7 h-7 text-emerald-700" />
                      </div>
                      <div>
                        <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                          For Charities & Book Donors
                        </span>
                        <h3 className="text-2xl font-bold text-stone-900 mt-2.5">
                          NGO & Donor Dashboard
                        </h3>
                        <p className="text-stone-600 text-sm mt-2 leading-relaxed">
                          Browse verified book requests from under-resourced schools across Pakistan. Pledge book batches, print TCS packing slips, and confirm school delivery.
                        </p>
                      </div>

              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 border border-stone-200 shadow-2xl space-y-6">
                {/* Modal Header */}
                <div className="flex items-start justify-between gap-4 border-b border-stone-100 pb-4">
                  <div>
                    <div className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${
                      authRole === 'school'
                        ? 'bg-amber-50 text-amber-800 border border-amber-200'
                        : 'bg-emerald-50 text-emerald-800 border border-emerald-200'
                    }`}>
                      <Icon name={authRole === 'school' ? 'School' : 'HeartHandshake'} className="w-3.5 h-3.5" />
                      <span>{authRole === 'school' ? 'School Administrator Portal' : 'NGO & Donor Dashboard'}</span>
                    </div>
                    <h3 className="text-xl font-bold text-stone-900 mt-2">
                      {authRole === 'school'
                        ? (authMode === 'signin' ? 'Sign In — School Portal' : 'Register Your School')
                        : (authMode === 'signin' ? 'Sign In — NGO Portal' : 'Register Your Organization')}
                    </h3>
                    <p className="text-xs text-stone-500 mt-0.5">
                      {authRole === 'school'
                        ? 'For headmasters and teachers to post and manage textbook requirements'
                        : 'For education charities and donors to pledge and track book deliveries'}
                    </p>
                  </div>
                  <button
                    onClick={() => setShowAuthModal(false)}
                    className="p-1.5 text-stone-400 hover:text-stone-700 rounded-lg cursor-pointer"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>


                {/* Mode Selector Tabs (Sign In vs Register) */}
                <div className="flex bg-stone-100 p-1 rounded-xl text-xs font-semibold">
                  <button
                    type="button"
                    onClick={() => { setAuthMode('signin'); setAuthError(null); }}
                    className={`flex-1 py-2 rounded-lg transition-all cursor-pointer ${
                      authMode === 'signin'
                        ? 'bg-white text-stone-900 shadow-sm'
                        : 'text-stone-500 hover:text-stone-900'
                    }`}
                  >
                    Sign In
                  </button>
                  <button
                    type="button"
                    onClick={() => { setAuthMode('signup'); setAuthError(null); }}
                    className={`flex-1 py-2 rounded-lg transition-all cursor-pointer ${
                      authMode === 'signup'
                        ? 'bg-white text-stone-900 shadow-sm'
                        : 'text-stone-500 hover:text-stone-900'
                    }`}
                  >
                    Create Account
                  </button>
                </div>

                {/* Error Banner */}
                {authError && (
                  <div className="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 flex items-center gap-2">
                    <Icon name="AlertCircle" className="w-4 h-4 text-rose-600 shrink-0" />
                    <span>{authError}</span>
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3.5">
                  {/* Portal Role Selector */}
                  <div className="space-y-1.5">
                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600">
                      Access Portal: *
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setAuthRole('school')}
                        className={`p-2.5 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                          authRole === 'school'
                            ? 'border-amber-500 bg-amber-50/80 text-amber-950 ring-2 ring-amber-200'
                            : 'border-stone-200 bg-white text-stone-600 hover:bg-stone-50'
                        }`}
                      >
                        <Icon name="School" className="w-4 h-4 text-amber-600" />
                        <span>School Portal</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setAuthRole('ngo')}
                        className={`p-2.5 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                          authRole === 'ngo'
                            ? 'border-emerald-500 bg-emerald-50/80 text-emerald-950 ring-2 ring-emerald-200'
                            : 'border-stone-200 bg-white text-stone-600 hover:bg-stone-50'
                        }`}
                      >
                        <Icon name="HeartHandshake" className="w-4 h-4 text-emerald-600" />
                        <span>NGO Portal</span>
                      </button>
                    </div>
                  </div>

                  {authMode === 'signup' && (
                    <>
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                          {authRole === 'school' ? 'Official School Name *' : 'NGO / Foundation Name *'}
                        </label>
                        <input
                          type="text"
                          required
                          value={authOrg}
                          onChange={(e) => setAuthOrg(e.target.value)}
                          placeholder={authRole === 'school' ? 'e.g., Al-Qalam Model High School' : 'e.g., The Citizens Foundation'}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                            Contact Person *
                          </label>
                          <input
                            type="text"
                            required
                            value={authName}
                            onChange={(e) => setAuthName(e.target.value)}
                            placeholder="e.g., Tahira Perveen"
                            className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                            City / District *
                          </label>
                          <input
                            type="text"
                            required
                            value={authLocation}
                            onChange={(e) => setAuthLocation(e.target.value)}
                            placeholder="e.g., Lahore, Punjab"
                            className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                          Official Phone / WhatsApp *
                        </label>
                        <input
                          type="text"
                          required
                          value={authPhone}
                          onChange={(e) => setAuthPhone(e.target.value)}
                          placeholder="e.g., +92 300 1234567"
                          className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                        />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                      Email Address *
                    </label>
                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      placeholder="e.g., contact@myschool.edu.pk"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">
                      Password *
                    </label>
                    <input
                      type="password"
                      required
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      placeholder="Minimum 6 characters"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:border-amber-500 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 px-4 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-semibold text-xs shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span>Processing...</span>
                      ) : (
                        <>
                          <Icon name={authMode === 'signin' ? 'LogIn' : 'Check'} className="w-4 h-4 text-amber-400" />
                          <span>
                            {authMode === 'signin'
                              ? `Sign In to ${authRole === 'school' ? 'School Portal' : 'NGO Portal'}`
                              : `Register ${authRole === 'school' ? 'School Account' : 'NGO Account'}`}
                          </span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-stone-200 py-6 px-4 text-center text-xs text-stone-500 mt-12">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2 font-semibold text-stone-700">
                <Icon name="BookOpen" className="w-4 h-4 text-emerald-600" />
                <span>Kitaab Dost Network — Connecting Classrooms & Education NGOs</span>
              </div>
              <div>
                Kitaab Dost Network — Bridging the Textbook Gap in Under-Resourced Pakistani Schools
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
